<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Designphysik · MODULNAME</title>
<link rel="stylesheet" href="../shared/style.css">
<!-- Farben nur aus shared/style.css: Physik-Familie wählen (--water, --light, --mech, --load), keine eigenen Farben -->
</head>
<body>
<header id="dp-header"></header>
<main>
  <section class="panel">
    <h2>Eingabe / Editor</h2>
    <canvas id="ed" role="img" style="--ar:1;aspect-ratio:1/1"></canvas>
  </section>
  <section class="panel">
    <h2>Ergebnis</h2>
    <canvas id="view" style="--ar:1;aspect-ratio:1/1"></canvas>
  </section>
  <section class="panel wide kpi">
    <h2>Kennwerte</h2>
    <div class="stats" id="stats"></div>
  </section>
  <section class="panel wide">
    <h2>Datei</h2>
    <div class="row"><button id="exp" class="q" data-i="down">Export</button><button id="imp" class="q" data-i="up">Import</button><button id="share" class="q" data-i="link">Link kopieren</button></div>
  </section>
  <section class="panel wide model">
    <h2>Modell &amp; Gültigkeit</h2>
    <details data-k="model"><summary>Modell und Grenzen lesen</summary><div class="txt">
      <h3>Modell</h3><p>Pflicht: Welches Modell? Wie genau? Was ist nicht modelliert? Ab wann Fachplanung?</p>
    </div></details>
  </section>
</main>

<script src="../shared/util.js"></script>
<script src="../shared/chart.js"></script>
<script>
// === CORE START
// Reine Physik: kein DOM, keine globalen UI-Variablen. Wird von test.js in Node geladen.
const Core = (() => {
  function beispiel(x) { return 2 * x; }
  return { beispiel };
})();
if (typeof module !== 'undefined') module.exports = Core;
// === CORE END

// ---- UI ----
const S = {};           // Zustand (Eingaben)
let G = {};             // abgeleitete Größen
function recompute() { /* Core aufrufen, G füllen */ }
function drawAll() { /* Canvas zeichnen mit prep(), chart(); Kennwerte: $('stats').innerHTML = dpStats(dpVerdict(0, 'Satz in Designsprache'), [{ l, v, n, t }], [...]) */ }

dpHeader('MODULKEY'); dpIcons();
recompute(); drawAll();
window.addEventListener('resize', drawAll);
</script>
</body>
</html>
