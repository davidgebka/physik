name: Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Alle Modul-Tests
        run: for t in */test.js; do echo "== $t"; node "$t" || exit 1; done
